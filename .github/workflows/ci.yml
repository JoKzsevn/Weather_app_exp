name: Weather Project CI

on:
  push:
  pull_request:

jobs:

  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Run Python tests
        run: uv run pytest -v
        env:
          PYTHONPATH: src

      - name: Run tests with coverage
        run: |
            uv run pytest \
              --cov=weather_project \
              --cov-report=term-missing \
              --cov-fail-under=80
        env:
          PYTHONPATH: src

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard_SandBox/react_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build